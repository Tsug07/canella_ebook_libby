# ============================================================================
# BIBLIOTECA DE EBOOKS — NGINX CONFIG (SSL + reverse proxy).
# Arquivo: ebooks.conf | Local na VPS: /root/task_manager/docker/nginx/conf.d/ebooks.conf
# Troque biblioteca.canellaesantos.com.br pelo subdominio escolhido (3 lugares
# + os 2 caminhos do certificado).
# ============================================================================

upstream ebooks_backend {
    server canella_ebooks:8020 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name biblioteca.canellaesantos.com.br;

    ssl_certificate     /etc/letsencrypt/live/biblioteca.canellaesantos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biblioteca.canellaesantos.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_ebooks:10m;
    ssl_session_timeout 10m;

    # Upload de PDF pelo painel (o app limita a 100 MB).
    client_max_body_size 110M;

    access_log /var/log/nginx/ebooks_access.log;
    error_log  /var/log/nginx/ebooks_error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://ebooks_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name biblioteca.canellaesantos.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
