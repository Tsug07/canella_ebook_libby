<script>

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  const URL_PDF = 'pdfs/contratar-o-1o-funcionario.pdf';
  const lib = window['pdfjs-dist/build/pdf'];
  lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const area = document.getElementById('paginas');
  const ind = document.getElementById('ind');
  let doc, base, zoom = 1, total = 0;
  const caixas = [], feitas = new Map(); // nº da página -> escala renderizada

  const largura = () => Math.min(920, window.innerWidth - 24);
  const escala = vp => zoom * largura() / vp.width;

  function montar(){
    area.innerHTML = '';
    caixas.length = 0; feitas.clear();
    for (let i = 1; i <= total; i++){
      const d = document.createElement('div');
      d.className = 'pagina'; d.dataset.n = i;
      const s = escala(base);
      d.style.width = base.width * s + 'px'; d.style.height = base.height * s + 'px';
      area.appendChild(d); caixas.push(d); vista.observe(d); atual.observe(d);
    }
  }

  async function desenhar(div){
    const n = +div.dataset.n;
    const pag = await doc.getPage(n);
    const vp1 = pag.getViewport({scale: 1});
    const s = escala(vp1);
    if (feitas.get(n) === s) return;
    feitas.set(n, s);
    const vp = pag.getViewport({scale: s});
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cv = document.createElement('canvas');
    cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
    div.style.width = vp.width + 'px'; div.style.height = vp.height + 'px';
    await pag.render({canvasContext: cv.getContext('2d'), viewport: vp,
                      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null}).promise;
    div.replaceChildren(cv);
  }

  // Renderiza só o que está perto da tela (ebooks longos não travam o celular).
  const vista = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) desenhar(e.target);
  }), {rootMargin: '1200px 0px'});
  const atual = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) ind.textContent = e.target.dataset.n + ' / ' + total;
  }), {rootMargin: '-45% 0px -45% 0px'});

  function aplicarZoom(z){
    const ref = caixas.find(c => c.getBoundingClientRect().bottom > 80);
    zoom = Math.max(.5, Math.min(2.5, z));
    caixas.forEach(c => {
      const s = escala(base);
      if (!feitas.has(+c.dataset.n)) { c.style.width = base.width * s + 'px'; c.style.height = base.height * s + 'px'; }
    });
    feitas.forEach((_, n) => feitas.set(n, -1)); // força redesenho nas visíveis
    caixas.forEach(c => { vista.unobserve(c); vista.observe(c); });
    if (ref) ref.scrollIntoView({block: 'start'});
  }
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) return;
    if (e.key === '+' || e.key === '=') aplicarZoom(zoom + .2);
    if (e.key === '-') aplicarZoom(zoom - .2);
  });
  document.getElementById('mais').onclick = () => aplicarZoom(zoom + .2);
  document.getElementById('menos').onclick = () => aplicarZoom(zoom - .2);
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => aplicarZoom(zoom), 200); });

  lib.getDocument({url: URL_PDF, withCredentials: true}).promise.then(async d => {
    doc = d; total = d.numPages;
    base = (await d.getPage(1)).getViewport({scale: 1});
    ind.textContent = '1 / ' + total;
    montar();
  }).catch(() => {
    area.innerHTML = '<div class="carregando">Não foi possível abrir o ebook aqui. <a style="color:var(--dourado)" href="/ler/contratar-o-1o-funcionario/download">Baixe o PDF</a>.</div>';
  });

  const qs = new URLSearchParams(location.search);
  if (qs.has('bemvindo') || qs.has('presente')){
    const el = document.getElementById('toast');
    el.textContent = qs.has('presente') ? 'Ebook liberado! Ele fica guardado na sua estante.' : 'Acesso liberado! Boa leitura.';
    requestAnimationFrame(() => el.classList.add('ver'));
    setTimeout(() => el.classList.remove('ver'), 4500);
    history.replaceState(null, '', location.pathname);
  }
})();
</script>
